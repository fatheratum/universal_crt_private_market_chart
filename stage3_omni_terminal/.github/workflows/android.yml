name: Stage 3 Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Verify V4 engine is packaged
        run: |
          test -f app/src/main/assets/universal_crt_v4.py
          echo "V4 ENGINE FOUND"
          wc -c app/src/main/assets/universal_crt_v4.py

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Stage 3 APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: stage3-omni-terminal-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
