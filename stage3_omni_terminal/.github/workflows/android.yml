name: Stage 3 Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: BUILD APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stage3_omni_terminal
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify Project
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/universal_crt_v4.py
          test -f app/src/main/python/omni_runner.py
          echo "STAGE 3 ANDROID PROJECT VERIFIED"

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          echo "========================================"
          echo "APK BUILD SUCCESSFUL"
          echo "========================================"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Stage3-Omni-Terminal-debug
          path: stage3_omni_terminal/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
