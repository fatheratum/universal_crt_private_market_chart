name: Build Stage 3 Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Stage 3 APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: stage3_omni_terminal

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify Android project
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/fatheratum/omniterminal/MainActivity.kt
          test -f app/src/main/java/com/fatheratum/omniterminal/PtyProcess.kt
          test -f app/src/main/java/com/fatheratum/omniterminal/TerminalView.kt
          test -f app/src/main/python/omni_runner.py
          test -f app/src/main/assets/universal_crt_v4.py
          echo "ANDROID PROJECT VERIFIED"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          echo "APK BUILD VERIFIED"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Stage3-Omni-Terminal-debug
          path: stage3_omni_terminal/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
