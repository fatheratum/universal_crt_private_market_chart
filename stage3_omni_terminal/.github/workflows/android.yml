name: "CRT TERMINAL — STAGE 3 APK ARTIFACT BUILD"

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    name: "CRT TERMINAL — ANDROID APK ARTIFACT BUILD"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stage3_omni_terminal

    steps:
      - name: "CHECKOUT STAGE 3"
        uses: actions/checkout@v4

      - name: "SETUP JDK"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: "SETUP ANDROID SDK"
        uses: android-actions/setup-android@v3

      - name: "INSTALL ANDROID BUILD TOOLS"
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: "VERIFY STAGE 3 PROJECT"
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/universal_crt_v4.py
          test -f app/src/main/python/omni_runner.py

      - name: "BUILD APK ARTIFACT"
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: "VERIFY APK ARTIFACT"
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: "UPLOAD APK ARTIFACT"
        uses: actions/upload-artifact@v4
        with:
          name: CRT-TERMINAL-STAGE-3-APK
          path: stage3_omni_terminal/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
