name: UNIVERSAL CRT V4 — STAGE 3 ANDROID APK BUILD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: UNIVERSAL CRT V4 — BUILD ANDROID APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stage3_omni_terminal

    steps:
      - name: CHECKOUT UNIVERSAL CRT V4
        uses: actions/checkout@v4

      - name: SETUP JAVA
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: SETUP ANDROID SDK
        uses: android-actions/setup-android@v3

      - name: INSTALL ANDROID BUILD TOOLS
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: VERIFY UNIVERSAL CRT V4 ANDROID PROJECT
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/universal_crt_v4.py
          test -f app/src/main/python/omni_runner.py
          echo "UNIVERSAL CRT V4 PROJECT VERIFIED"

      - name: BUILD UNIVERSAL CRT V4 ANDROID APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: VERIFY UNIVERSAL CRT V4 APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          echo "=============================================="
          echo "UNIVERSAL CRT V4 — STAGE 3 APK BUILD COMPLETE"
          echo "=============================================="
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: UPLOAD UNIVERSAL CRT V4 APK
        uses: actions/upload-artifact@v4
        with:
          name: UNIVERSAL-CRT-V4-STAGE-3-ANDROID-APK
          path: stage3_omni_terminal/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
