name: CRT terminal build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: stage3_omni_terminal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Stage 3 project
        run: |
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/assets/universal_crt_v4.py
          test -f app/src/main/python/omni_runner.py
          echo "STAGE 3 PROJECT: VERIFIED"
          echo "V4 ENGINE: VERIFIED"
          wc -c app/src/main/assets/universal_crt_v4.py

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Stage 3 APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          echo "APK BUILD: VERIFIED"
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Stage 3 APK
        uses: actions/upload-artifact@v4
        with:
          name: Stage3-Omni-Terminal-debug-apk
          path: stage3_omni_terminal/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
