plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'com.fatheratum.omniterminal'
    compileSdk 35

    defaultConfig {
        applicationId 'com.fatheratum.omniterminal'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '3.0.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
}

chaquopy {
    defaultConfig {
        version = "3.11"
    }
}

dependencies {
}
